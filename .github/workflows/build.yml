name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate xcodeproj and archive (unsigned)
        run: |
          rm -rf DZMeBookRead.xcodeproj
          SRC="$PWD/Reader3App"
          BD="/tmp/build"
          # generate xcodeproj
          swift package generate-xcodeproj --output . 2>&1 || true
          ls *.xcodeproj 2>/dev/null || echo "no xcodeproj generated"
          # try archive with the generated xcodeproj
          for xcproj in *.xcodeproj; do
            if [ -d "$xcproj" ]; then
              xcodebuild -project "$xcproj" -scheme Reader3App -destination generic/platform=iOS \
                -archivePath "$BD/Reader3App.xcarchive" \
                CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
                archive 2>&1 | tail -20
              break
            fi
          done
          # check for .app
          find "$BD" -name "*.app" -type d 2>/dev/null
          echo "=== DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa