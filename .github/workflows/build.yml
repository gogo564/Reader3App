name: Build IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tail -3

      - name: Generate xcodeproj with XcodeGen
        run: xcodegen generate --project . 2>&1

      - name: Archive (unsigned)
        run: |
          LOG=$(mktemp)
          xcodebuild -project Reader3App.xcodeproj -scheme Reader3App -destination generic/platform=iOS \
            -archivePath /tmp/Reader3App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -verbose archive 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          gzip "$LOG" || true
          mv "$LOG.gz" /tmp/build_log.gz 2>/dev/null || true
          if [ $RC -ne 0 ]; then
            LOGFILE="$LOG"
            if [ -f /tmp/build_log.gz ]; then
              set +x
              echo "=== BUILD LOG (error lines) ==="
              gzip -dc /tmp/build_log.gz 2>/dev/null | grep -iE '(error:|failed:|BUILD FAILED|ARCHIVE FAILED|fatal:)' | head -30
              echo "=== BUILD LOG (last 40 lines) ==="
              gzip -dc /tmp/build_log.gz 2>/dev/null | tail -40
              echo "=== BUILD LOG (full) ==="
              gzip -dc /tmp/build_log.gz 2>/dev/null | head -200
            fi
            exit $RC
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: /tmp/build_log.gz

      - name: Package IPA
        run: |
          APP=$(find /tmp/Reader3App.xcarchive -name "*.app" -type d | head -1)
          echo "App: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found"
            exit 1
          fi
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r Reader3App.ipa Payload/
          ls -lh Reader3App.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa