name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build with SwiftPM (unsigned)
        run: |
          rm -rf DZMeBookRead.xcodeproj
          SRC="$PWD/Reader3App"
          xcodebuild -scheme Reader3App-Package -destination generic/platform=iOS \
            SWIFT_OBJC_BRIDGING_HEADER="$SRC/DZMeBookRead/other/DZMeBookRead-Bridging-Pch.h" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/build.log | tail -5
          echo "=== ERRORS ==="
          grep -n "error:" /tmp/build.log | head -30

      - name: Package IPA (unsigned)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r Reader3App.ipa Payload/
          ls -lh Reader3App.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa