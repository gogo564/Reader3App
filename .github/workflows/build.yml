name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tail -3

      - name: Generate xcodeproj with XcodeGen
        run: xcodegen generate --project . 2>&1

      - name: Archive (unsigned)
        run: |
          xcodebuild -project Reader3App.xcodeproj -scheme Reader3App -destination generic/platform=iOS \
            -archivePath /tmp/Reader3App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tail -10

      - name: Package IPA
        run: |
          APP=$(find /tmp/Reader3App.xcarchive -name "*.app" -type d | head -1)
          echo "App: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found"
            exit 1
          fi
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r Reader3App.ipa Payload/
          ls -lh Reader3App.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa