name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test Package.swift
        run: |
          xcodebuild -list 2>&1 | head -20
          echo "---"
          xcodebuild -scheme Reader3App -destination generic/platform=iOS build 2>&1 | tail -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
