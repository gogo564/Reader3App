name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build Archive
      run: |
        xcodebuild archive \
          -project ReaderApp.xcodeproj \
          -scheme ReaderApp \
          -archivePath build/ReaderApp.xcarchive \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        mkdir -p build/ipa
        xcodebuild -exportArchive \
          -archivePath build/ReaderApp.xcarchive \
          -exportPath build/ipa \
          -exportOptionsPlist ExportOptions.plist \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ReaderApp.ipa
        path: build/ipa/*.ipa
