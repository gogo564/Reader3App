name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Archive (unsigned)
        run: |
          rm -rf DZMeBookRead.xcodeproj
          SRC="$PWD/Reader3App"
          xcodebuild -scheme Reader3App-Package -destination generic/platform=iOS \
            -archivePath /tmp/Reader3App.xcarchive \
            SWIFT_OBJC_BRIDGING_HEADER="$SRC/DZMeBookRead/other/DZMeBookRead-Bridging-Pch.h" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            PRODUCT_TYPE="com.apple.product-type.application" \
            INFOPLIST_FILE="$SRC/Info.plist" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tail -20
          echo "=== CHECK ==="
          find /tmp/Reader3App.xcarchive -name "*.app" -type d 2>/dev/null | head -3
          ls -la /tmp/Reader3App.xcarchive/Products/Applications/ 2>/dev/null

      - name: Package IPA
        run: |
          APP=$(find /tmp/Reader3App.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found, trying DerivedData..."
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found"
            exit 1
          fi
          echo "App: $APP"
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r Reader3App.ipa Payload/
          ls -lh Reader3App.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa