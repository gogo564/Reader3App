name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Try Rosetta x86_64
        run: |
          arch -x86_64 /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/xcodebuild archive \
            -project DZMeBookRead.xcodeproj \
            -scheme Reader3App \
            -configuration Release \
            -archivePath /tmp/ra.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
