name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Generate Xcode project
      run: python3 generate_project.py

    - name: Build Archive
      run: |
        xcodebuild archive \
          -project ReaderApp.xcodeproj \
          -scheme ReaderApp \
          -archivePath build/ReaderApp.xcarchive \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_REQUIRED=NO

    - name: Package IPA (unsigned)
      run: |
        mkdir -p build/ipa/Payload
        cp -r "build/ReaderApp.xcarchive/Products/Applications/ReaderApp.app" build/ipa/Payload/
        cd build/ipa
        zip -qr ReaderApp.ipa Payload/
        rm -rf Payload
        ls -la ReaderApp.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ReaderApp.ipa
        path: build/ipa/ReaderApp.ipa
