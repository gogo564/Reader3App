name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Remove workspace and build
        run: |
          rm -rf DZMeBookRead.xcodeproj/project.xcworkspace
          xcodebuild archive \
            -project DZMeBookRead.xcodeproj \
            -scheme Reader3App \
            -configuration Release \
            -archivePath /tmp/Reader3App.xcarchive \
            IDEPackageSupportUseBuiltinSCM=NO \
            IDESuppressIndexing=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
