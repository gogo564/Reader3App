name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Try auto-detect
        run: |
          xcodebuild -list 2>&1 | head -10
          echo "---"
          xcodebuild -scheme Reader3App -list 2>&1 | head -10 || true