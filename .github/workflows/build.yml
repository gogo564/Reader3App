name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Try absolute path and sudo
        run: |
          echo "=== Try absolute path ==="
          /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/xcodebuild list -project "$PWD/DZMeBookRead.xcodeproj" 2>&1 | head -5 || true
          echo "=== Try with sudo ==="
          sudo /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/xcodebuild list -project "$PWD/DZMeBookRead.xcodeproj" 2>&1 | head -5 || true
          echo "=== Try Package.swift approach ==="
          cp -a Reader3App /tmp/iosapp
          cd /tmp/iosapp
          swift build 2>&1 | tail -5 || true