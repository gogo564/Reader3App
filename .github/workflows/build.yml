name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Check Xcode
        run: |
          xcodebuild -version
          plutil -lint DZMeBookRead.xcodeproj/project.pbxproj || true
          head -20 DZMeBookRead.xcodeproj/project.pbxproj
          ls -la DZMeBookRead.xcodeproj/
          ls -la DZMeBookRead.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "No schemes dir"

      - name: Show pbxproj section headers
        run: |
          grep -n "Begin\|End\|objectVersion\|archiveVersion" DZMeBookRead.xcodeproj/project.pbxproj
          echo "---File ends with:---"
          tail -5 DZMeBookRead.xcodeproj/project.pbxproj
          file DZMeBookRead.xcodeproj/project.pbxproj

      - name: Try to open project
        run: |
          echo "=== xattr ==="
          xattr -l DZMeBookRead.xcodeproj/project.pbxproj 2>&1 || echo "no xattr"
          ls -la@ DZMeBookRead.xcodeproj/ 2>&1 || ls -la DZMeBookRead.xcodeproj/
          echo "=== Test minimal project ==="
          mkdir -p /tmp/testproj/Minimal.xcodeproj
          echo "int main() { return 0; }" > /tmp/testproj/main.c
          python3 -c "
import textwrap
pbx = textwrap.dedent('''\\
// !\$*UTF8*\$!
{
\tarchiveVersion = 1;
\tclasses = { };
\tobjectVersion = 56;
\tobjects = {
/* Begin PBXBuildFile section */
\t\tA00000000000000000000001 /* main.c in Sources */ = {isa = PBXBuildFile; fileRef = A00000000000000000000002; };
/* End PBXBuildFile section */
/* Begin PBXFileReference section */
\t\tA00000000000000000000002 /* main.c */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.c; path = main.c; sourceTree = \"<group>\"; };
\t\tA00000000000000000000003 /* Minimal.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = Minimal.app; sourceTree = BUILT_PRODUCTS_DIR; };
/* End PBXFileReference section */
/* Begin PBXGroup section */
\t\tA00000000000000000000004 = {isa = PBXGroup; children = (A00000000000000000000005 /* Products */, A00000000000000000000002 /* main.c */,); sourceTree = \"<group>\"; };
\t\tA00000000000000000000005 /* Products */ = {isa = PBXGroup; children = (A00000000000000000000003 /* Minimal.app */,); name = Products; sourceTree = \"<group>\"; };
/* End PBXGroup section */
/* Begin PBXNativeTarget section */
\t\tA00000000000000000000006 /* Minimal */ = {isa = PBXNativeTarget; buildConfigurationList = A00000000000000000000007; buildPhases = (A00000000000000000000008 /* Sources */,); name = Minimal; productName = Minimal; productReference = A00000000000000000000003; productType = \"com.apple.product-type.application\"; };
/* End PBXNativeTarget section */
/* Begin PBXProject section */
\t\tA00000000000000000000009 /* Project object */ = {isa = PBXProject; buildConfigurationList = A0000000000000000000000A; compatibilityVersion = \"Xcode 14.0\"; mainGroup = A00000000000000000000004; productRefGroup = A00000000000000000000005; projectDirPath = \"\"; projectRoot = \"\"; targets = (A00000000000000000000006 /* Minimal */,); };
/* End PBXProject section */
/* Begin PBXSourcesBuildPhase section */
\t\tA00000000000000000000008 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A00000000000000000000001 /* main.c in Sources */,); runOnlyForDeploymentPostprocessing = 0; };
/* End PBXSourcesBuildPhase section */
/* Begin XCBuildConfiguration section */
\t\tA0000000000000000000000B /* Debug */ = {isa = XCBuildConfiguration; buildSettings = { PRODUCT_NAME = Minimal; }; name = Debug; };
\t\tA0000000000000000000000C /* Release */ = {isa = XCBuildConfiguration; buildSettings = { PRODUCT_NAME = Minimal; }; name = Release; };
/* End XCBuildConfiguration section */
/* Begin XCBuildConfigurationList section */
\t\tA0000000000000000000000A /* Project config list */ = {isa = XCBuildConfigurationList; buildConfigurations = (A0000000000000000000000B /* Debug */, A0000000000000000000000C /* Release */,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
\t\tA00000000000000000000007 /* Target config list */ = {isa = XCBuildConfigurationList; buildConfigurations = (A0000000000000000000000B /* Debug */, A0000000000000000000000C /* Release */,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
/* End XCBuildConfigurationList section */
\t};
}
''')
with open('/tmp/testproj/Minimal.xcodeproj/project.pbxproj', 'w') as f:
    f.write(pbx)
"
          plutil -lint /tmp/testproj/Minimal.xcodeproj/project.pbxproj
          xcodebuild -list -project /tmp/testproj/Minimal.xcodeproj 2>&1 || true
          xcodebuild -project /tmp/testproj/Minimal.xcodeproj -scheme Minimal build 2>&1 | tail -10 || true

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project DZMeBookRead.xcodeproj \
            -scheme Reader3App \
            -configuration Release \
            -archivePath /tmp/Reader3App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath /tmp/Reader3App.xcarchive \
            -exportPath /tmp/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
