name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project "$PWD/DZMeBookRead.xcodeproj" \
            -scheme Reader3App \
            -configuration Release \
            -archivePath /tmp/ipa.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30

      - name: Export IPA
        if: success()
        run: |
          xcodebuild -exportArchive \
            -archivePath /tmp/ipa.xcarchive \
            -exportPath /tmp/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
