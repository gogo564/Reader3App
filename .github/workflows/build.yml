name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build with xcodebuild
        run: |
          ls -la /Applications/Xcode*.app/Contents/Developer/usr/bin/xcodebuild 2>/dev/null | head -3
          echo "=== Check xcrun ==="
          xcrun --find xcodebuild 2>&1 || true
          echo "=== Try xcodebuild -verbose ==="
          xcodebuild -verbose -list -project DZMeBookRead.xcodeproj 2>&1 | head -20 || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
