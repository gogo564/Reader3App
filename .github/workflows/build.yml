name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Ultimate diagnostics
        run: |
          echo "=== Does any xcodebuild work? ==="
          cd /tmp
          mkdir -p testapp && cd testapp
          swift package init --type executable 2>&1 | tail -3
          swift build 2>&1 | tail -3
          echo "=== Can xcodebuild read ANYTHING? ==="
          xcodebuild -version
          cd /tmp/testapp
          xcodebuild -list 2>&1 | head -5 || echo "xcodebuild failed in /tmp/testapp"
          echo "=== Check Toolchain ==="
          xcrun --show-sdk-path 2>&1
          echo "=== Try pipe through cat ==="
          cat /dev/null | xcodebuild -version

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
