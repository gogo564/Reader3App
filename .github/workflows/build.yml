name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Check Xcode
        run: |
          xcodebuild -version
          plutil -lint DZMeBookRead.xcodeproj/project.pbxproj || true
          head -20 DZMeBookRead.xcodeproj/project.pbxproj
          ls -la DZMeBookRead.xcodeproj/
          ls -la DZMeBookRead.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "No schemes dir"

      - name: Show pbxproj section headers
        run: |
          grep -n "Begin\|End\|objectVersion\|archiveVersion" DZMeBookRead.xcodeproj/project.pbxproj
          echo "---File ends with:---"
          tail -5 DZMeBookRead.xcodeproj/project.pbxproj
          file DZMeBookRead.xcodeproj/project.pbxproj

      - name: Diagnose xcodebuild
        run: |
          echo "=== xattr ==="
          xattr -l DZMeBookRead.xcodeproj/project.pbxproj 2>&1 || echo "no xattr"
          ls -la@ DZMeBookRead.xcodeproj/ 2>&1 || ls -la DZMeBookRead.xcodeproj/
          echo "=== Test different Xcode versions ==="
          mkdir -p /tmp/xctest
          echo "int main(){}" > /tmp/xctest/main.c
          for ver in 16.2 16.1 15.4 15.3 15.2 15.1 15.0; do
            path="/Applications/Xcode_${ver}.app"
            if [ -f "$path/Contents/Developer/usr/bin/xcodebuild" ]; then
              echo "--- Xcode $ver ---"
              sudo xcode-select -s "$path" 2>/dev/null
              xcodebuild -version 2>&1 | head -1
              result=$(xcodebuild -list -project DZMeBookRead.xcodeproj 2>&1) || true
              echo "$result" | grep -E "error:|Reason:|Information about project" || echo "(no project info)"
            fi
          done
          echo "=== Restore Xcode 15.4 ==="
          sudo xcode-select -s /Applications/Xcode_15.4.app
          echo "=== swift build test ==="
          cd /tmp && rm -rf swift-test && mkdir -p swift-test && cd swift-test
          swift package init --type executable 2>&1 || true
          swift build 2>&1 | tail -3 || true

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project DZMeBookRead.xcodeproj \
            -scheme Reader3App \
            -configuration Release \
            -archivePath /tmp/Reader3App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath /tmp/Reader3App.xcarchive \
            -exportPath /tmp/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
