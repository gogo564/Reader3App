name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Check Xcode
        run: |
          xcodebuild -version
          plutil -lint DZMeBookRead.xcodeproj/project.pbxproj || true
          head -20 DZMeBookRead.xcodeproj/project.pbxproj
          ls -la DZMeBookRead.xcodeproj/
          ls -la DZMeBookRead.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "No schemes dir"

      - name: Show pbxproj section headers
        run: |
          grep -n "Begin\|End\|objectVersion\|archiveVersion" DZMeBookRead.xcodeproj/project.pbxproj
          echo "---File ends with:---"
          tail -5 DZMeBookRead.xcodeproj/project.pbxproj
          file DZMeBookRead.xcodeproj/project.pbxproj

      - name: Try to open project
        run: |
          echo "=== xattr ==="
          xattr -l DZMeBookRead.xcodeproj/project.pbxproj 2>&1 || echo "no xattr"
          ls -la@ DZMeBookRead.xcodeproj/ 2>&1 || ls -la DZMeBookRead.xcodeproj/
          echo "=== Try older Xcode ==="
          ls /Applications/Xcode*.app/Contents/Developer/usr/bin/xcodebuild 2>/dev/null || echo "no other Xcode"
          echo "=== swift build test ==="
          cd /tmp && mkdir -p swift-test && cd swift-test
          swift package init --type executable 2>&1 || true
          swift build 2>&1 | tail -5 || true

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project DZMeBookRead.xcodeproj \
            -scheme Reader3App \
            -configuration Release \
            -archivePath /tmp/Reader3App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath /tmp/Reader3App.xcarchive \
            -exportPath /tmp/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
