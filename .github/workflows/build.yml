name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          TMPDIR=/tmp \
          xcodebuild build \
            -project DZMeBookRead.xcodeproj \
            -scheme Reader3App \
            -configuration Release \
            -derivedDataPath /tmp/dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
