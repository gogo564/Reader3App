name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build with SwiftPM
        run: |
          rm -rf DZMeBookRead.xcodeproj
          xcodebuild -scheme Reader3App-Package -destination generic/platform=iOS build 2>&1 | tail -30

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader3App.ipa
          path: /tmp/ipa/Reader3App.ipa
