name: ReaderApp
options:
  bundleIdPrefix: com.gogo564
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: ReaderApp/Info.plist
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.gogo564.reader
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ReaderApp:
    type: application
    platform: iOS
    sources:
      - path: ReaderApp
    info:
      path: ReaderApp/Info.plist
    settings:
      base:
        PRODUCT_NAME: ReaderApp
        INFOPLIST_FILE: ReaderApp/Info.plist
